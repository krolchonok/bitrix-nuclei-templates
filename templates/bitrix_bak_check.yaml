id: bitrix-settings-bak

info:
  name: Bitrix .settings.php.bak Exposure
  author: JhonnyBonny
  severity: high
  description: Detects exposed backup of bitrix/.settings.php containing DB credentials.
  reference:
    - https://github.com/cr1f/writeups/blob/main/attacking_bitrix.pdf
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: bitrix,bak,exposure,config

http:
  - method: GET
    path:
      - '{{BaseURL}}/bitrix/.settings.php.bak'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "connections"
          - "'host'"
          - "'database'"
          - "'login'"
          - "'password'"
          - "$DB"
          - "class_name"
        condition: or
