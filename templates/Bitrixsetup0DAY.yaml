id: bitrix-bitrixsetup-panel

info:
  name: Bitrix Bitrixsetup Panel
  author: JhonnyBonny
  severity: high
  description: Exposed bitrixsetup.php installer panel.
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,bitrix,setup,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/bitrixsetup.php"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "bitrix"
        case-insensitive: true

      - type: word
        part: body
        words:
          - "Выбор продукта"
          - "Choose a package"
          - "Your license key"
          - "Лицензионный ключ"
        condition: or

      - type: status
        status:
          - 200
