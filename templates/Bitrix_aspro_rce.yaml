id: bitrix-aspro-exposure

info:
  name: Bitrix Aspro Component Files Exposure
  author: JhonnyBonny
  severity: medium
  description: |
    Detects publicly reachable Aspro theme/component endpoints often used as
    attack surface. Confirms response is not a soft-404.
  reference:
    - https://github.com/cr1f/writeups/blob/main/attacking_bitrix.pdf
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 7
  tags: bitrix,aspro,exposure

http:
  - method: GET
    path:
      - '{{BaseURL}}/ajax/reload_basket_fly.php'
      - '{{BaseURL}}/ajax/show_basket_fly.php'
      - '{{BaseURL}}/ajax/show_basket_popup.php'
      - '{{BaseURL}}/include/mainpage/comp_catalog_ajax.php'
      - '{{BaseURL}}/bitrix/components/aspro/oneclickbuy.max/script.php'
      - '{{BaseURL}}/bitrix/components/aspro/form.allcorp2/component.php'
      - '{{BaseURL}}/ajax/form.php'

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "404"
          - "Not Found"
          - "Not found"
          - "Страница не найдена"
          - "Не найдено"
        negative: true

      - type: dsl
        dsl:
          - "len(body) > 20"
