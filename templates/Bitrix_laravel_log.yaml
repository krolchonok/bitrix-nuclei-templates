id: bitrix-log-exposure

info:
  name: Bitrix / App Log File Exposure
  author: JhonnyBonny
  severity: medium
  description: Detects publicly accessible application log files.
  reference:
    - https://github.com/cr1f/writeups/blob/main/attacking_bitrix.pdf
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 3
  tags: bitrix,logs,exposure

http:
  - method: GET
    path:
      - '{{BaseURL}}/log.txt'
      - '{{BaseURL}}/log.log'
      - '{{BaseURL}}/__bx_log.log'

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "Stack trace"
          - "stack trace"
          - "[stacktrace]"
          - "Illuminate\\"
          - "Laravel\\"
          - "PHP Fatal"
          - "PHP Warning"
          - "PHP Notice"
          - "Bitrix\\"
          - "bitrix\\"
          - "ERROR"
          - "Exception"
          - "Trace:"
        condition: or

      - type: dsl
        dsl:
          - "len(body) > 50"
