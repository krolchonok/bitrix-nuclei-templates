id: bitrix-restore-exposure

info:
  name: Bitrix restore.php Exposure
  author: JhonnyBonny
  severity: high
  description: Detects exposed Bitrix restore/installer script (potential RCE surface).
  reference:
    - https://github.com/cr1f/writeups/blob/main/attacking_bitrix.pdf
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 2
  tags: bitrix,restore,exposure,rce

http:
  - method: GET
    path:
      - '{{BaseURL}}/bitrix/restore.php?lang=en'
      - '{{BaseURL}}/restore.php?lang=en'

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "Bitrix"
          - "bitrix"
          - "Restore"
          - "restore"
          - "Восстановление"
          - "Архив"
          - "Step"
        condition: or

      - type: word
        part: body
        words:
          - "404 Not Found"
          - "Страница не найдена"
          - "Not Found"
        negative: true
        condition: or
