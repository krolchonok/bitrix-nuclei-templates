id: bitrix-open-redirect

info:
  name: Bitrix Open URL Redirect
  author: JhonnyBonny
  severity: low
  reference:
    - https://packetstormsecurity.com/files/151955/1C-Bitrix-Site-Management-Russia-2.0-Open-Redirection.html
  metadata:
    max-request: 1
  tags: redirect,bitrix,bitrix24

http:
  - raw:
      - |
        GET /bitrix/redirect.php?event1=&event2=&event3=download&goto=https://example.com HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; rv:68.0) Gecko/20100101 Firefox/68.0
        Accept-Encoding: gzip, deflate
        Accept: */*

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?://|//)?(?:[a-zA-Z0-9\-_\.@]*)example\.com.*$'

      - type: status
        status:
          - 301
          - 302
        condition: or
